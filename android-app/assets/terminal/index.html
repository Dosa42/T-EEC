<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="theme-color" content="#0c0f12">
<meta name="color-scheme" content="only dark">
<title>T-EEC</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/terminal/xterm.css">
<link rel="stylesheet" href="/terminal/style.css">
<script defer src="/terminal/xterm.js"></script>
<script defer src="/terminal/addon-fit.js"></script>
<script defer src="/terminal/app.js"></script>
<script defer src="/terminal/teec.js"></script>
</head>
<body>
<main class="terminal-area" aria-label="T-EEC terminal">
<header class="terminal-bar">
<h1>T-EEC</h1>
<label class="sr-only" for="sessions">Terminal session</label>
<select id="sessions" aria-label="Terminal session"></select>
<button id="new-terminal" type="button" aria-label="New terminal" title="New terminal" disabled>+</button>
<button id="close-terminal" type="button" aria-label="Close terminal" title="Close terminal">×</button>
<a id="open-terminal" href="/terminal" target="_blank" rel="noopener" aria-label="Open terminal in a new tab" title="Open in new tab">↗</a>
<span class="bar-space"></span>
<button id="reconnect" type="button" aria-label="Reconnect" title="Reconnect" disabled>↻</button>
<button id="toggle-pane" type="button" aria-controls="eec-pane" aria-expanded="true">EEC <span aria-hidden="true">▸</span></button>
</header>
<div class="terminal-body">
<div id="terminal" aria-label="PTY terminal"></div>
<aside id="eec-pane" aria-labelledby="pane-title">
<div class="pane-title"><h2 id="pane-title">EEC</h2><span>MODULES</span></div>
<div class="module-row">
<label class="module-control" for="epistemic"><span>Epistemic</span><span class="switch"><input id="epistemic" type="checkbox" role="switch" aria-describedby="epistemic-mode"><span class="switch-track" aria-hidden="true"></span></span></label>
<div class="module-detail"><span id="epistemic-mode">Auto-catch</span><output id="epistemic-state" for="epistemic">OFF</output></div>
</div>
<div class="module-row">
<label class="module-control" for="evidence"><span>Evidence</span><span class="switch"><input id="evidence" type="checkbox" role="switch" aria-describedby="evidence-mode"><span class="switch-track" aria-hidden="true"></span></span></label>
<div class="module-detail"><span id="evidence-mode">Temporary log</span><output id="evidence-state" for="evidence">OFF</output></div>
</div>
<div class="module-row">
<label class="module-control" for="capsule"><span>Capsule</span><span class="switch"><input id="capsule" type="checkbox" role="switch" aria-describedby="capsule-mode"><span class="switch-track" aria-hidden="true"></span></span></label>
<div class="module-detail"><span id="capsule-mode">Seal / sign / package</span><output id="capsule-state" for="capsule">OFF</output></div>
</div>
<div class="module-backend"><span>Backend</span><span id="eec-backend-state">unbound</span></div>
</aside>
</div>
<footer class="terminal-statusbar">
<div class="keys" role="group" aria-label="Terminal keys">
<button type="button" data-key="interrupt">^C</button><button type="button" data-key="tab">Tab</button><button type="button" data-key="escape">Esc</button><button type="button" data-key="up" aria-label="Previous command">↑</button><button type="button" data-key="down" aria-label="Next command">↓</button><button id="keyboard" type="button" aria-label="Focus keyboard" title="Focus keyboard">⌨</button>
</div>
<span id="status" role="status" aria-live="polite">Connecting…</span>
<span id="session" aria-label="Current session"></span>
</footer>
</main>
<div id="module-announcement" class="sr-only" role="status" aria-live="polite"></div>
<noscript>JavaScript is required for the terminal.</noscript>
</body>
</html>
